org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter warns that applying kotlin-android will break in a future release,
# but built-in Kotlin cannot be enabled yet: the bundled Flutter plugin modules
# (shared_preferences_android, url_launcher_android, ...) still apply
# org.jetbrains.kotlin.android themselves, and AGP 9 rejects that combination.
# Re-check after upgrading those plugins.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
org.gradle.parallel=true
org.gradle.caching=true
