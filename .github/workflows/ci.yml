name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Download pub dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/

      - name: Clean coverage report
        run: |
          lcov --remove coverage/lcov.info \
            'lib/**.gen.dart' \
            'lib/generated/**' \
            'lib/l10n/app_localizations*.dart' \
            'lib/di/**' \
            'lib/constants/**' \
            'lib/routers/router.dart' \
            -o coverage/lcov.info \
            --ignore-errors unused

      - name: Check Code Coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
        with:
          path: coverage/lcov.info
          min_coverage: 59
          exclude: |
            **/*.g.dart
            **/*.gen.dart
            lib/di/**
            lib/generated/**
            lib/l10n/app_localizations*.dart
            lib/constants/**
            lib/routers/router.dart

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

      - name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info

  integration-tests:
    name: Flutter Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        api-level: [ 31 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android emulator and run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          script: |
            flutter pub get
            flutter test integration_test --flavor dev

  build-android:
    name: Android Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      # Unsigned: release signing keys are only available to the release
      # workflow. This proves the prod flavor assembles, shrinks and links.
      - name: Build prod release bundle
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart

      - name: Verify generated sources are up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code || {
            echo "::error::Generated sources are stale. Run 'make gen' and commit the result."
            exit 1
          }
